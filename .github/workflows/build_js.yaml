name: Build Mozilla JS Static Library

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt update
          sudo apt install -y python2.7 build-essential libnspr4 libnspr4-dev

      - name: Build Debug (.a)
        run: |
          make -f libjs.make distclean
          make -f libjs.make debug=yes -j$(nproc)
          # Move to a staging area
          mkdir -p staging/lib
          cp js/src/build-debug/libjs_static.a staging/lib/libjsdbg_static.a

      - name: Build Release (.a)
        run: |
          make -f libjs.make distclean
          make -f libjs.make -j$(nproc)
          # Move to a staging area
          cp js/src/build-release/libjs_static.a staging/lib/

      - name: Prepare Header Files
        run: |
          mkdir -p staging/include
          cp js/src/*.h staging/include/
          cp js/src/*.tbl staging/include/
          cp js/src/build-release/*.h staging/include/

      - name: Create Artifact Archive
        run: |
          cd staging
          tar -czvf ../mozilla-js-static-lib.tar.gz .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mozilla-js-static-lib.tar.gz
          body: "Includes both libjs_static.a (release) and libjsdbg_static.a (debug)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
